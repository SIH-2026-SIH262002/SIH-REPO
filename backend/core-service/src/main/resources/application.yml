server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: core-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:ner_logistics}
    username: ${DB_USER:sih_admin}
    password: ${DB_PASSWORD:sih_secure_password_2026}
    driver-class-name: org.postgresql.Driver

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  kafka:
    bootstrap-servers: ${KAFKA_SERVERS:localhost:9092}
    consumer:
      group-id: ner-logistics-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

jwt:
  secret: ${JWT_SECRET:dGhpcy1pcy1hLXNlY3VyZS0yNTYtYml0LXNlY3JldC1rZXktZm9yLXNpLWxvZ2lzdGljcy0yMDI2}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

ml:
  prediction:
    enabled: ${ML_PREDICTION_ENABLED:false}
    base-url: ${ML_SERVICE_URL:http://localhost:8000}
    timeout: ${ML_SERVICE_TIMEOUT:5000}

risk:
  predictive:
    critical-threshold: ${RISK_CRITICAL_THRESHOLD:0.80}
    high-threshold: ${RISK_HIGH_THRESHOLD:0.60}
    medium-threshold: ${RISK_MEDIUM_THRESHOLD:0.30}
