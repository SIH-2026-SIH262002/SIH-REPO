version: '3.8'

services:
  # Primary Spatial Database
  postgis:
    image: postgis/postgis:15-3.3
    container_name: ner-postgis
    restart: always
    environment:
      POSTGRES_DB: ner_logistics
      POSTGRES_USER: sih_admin
      POSTGRES_PASSWORD: sih_secure_password_2026
    ports:
      # Host port 5433, not 5432 -- this machine already has a native
      # PostgreSQL 18 Windows service bound to 5432, unrelated to this
      # project; remapping avoids silently colliding with it.
      - "5433:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./postgis/init-postgis.sql:/docker-entrypoint-initdb.d/init-postgis.sql

  # Real-Time Telemetry & Ephemeral Cache
  redis:
    image: redis:7-alpine
    container_name: ner-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Event Streaming - Kafka & Zookeeper
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: ner-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: ner-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # IoT & Sensor Data Ingestion Gateway
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: ner-mqtt-broker
    restart: always
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto/config:/mosquitto/config

  # GraphHopper Routing Engine (OSM + Elevation/Hazard Constraints)
  graphhopper:
    image: israelhikingmap/graphhopper:latest
    container_name: ner-graphhopper
    restart: always
    ports:
      - "8989:8989"
    environment:
      JAVA_OPTS: "-Xmx2g -Xms2g"
    volumes:
      - ./graphhopper/data:/data
    command: ["-i", "/data/north-eastern-zone-latest.osm.pbf", "-c", "config-example.yml"]

volumes:
  postgis_data:
  redis_data:
